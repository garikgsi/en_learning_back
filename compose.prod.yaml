name: en-learning-back-prod

x-php-service: &php-service
  build:
    context: .
    dockerfile: Dockerfile.prod
    target: app
  image: ${APP_IMAGE:-en-learning-back-app}:${APP_VERSION:-latest}
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: postgres
    DB_PORT: 5432
    XDEBUG_MODE: "off"
  volumes:
    - app_storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - backend

services:
  app:
    <<: *php-service
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    <<: *php-service
    user: www-data
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy

  queue:
    <<: *php-service
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: nginx
    image: ${NGINX_IMAGE:-en-learning-back-nginx}:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  postgres:
    image: postgres:18.4-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d ${DB_DATABASE:?DB_DATABASE is required}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  app_storage:
  postgres_data:
